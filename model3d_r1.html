<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>단축형 복합발전 · 17단 압축기 + 부드러운 흡기 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --neon:#25E8E0; --line:rgba(160,195,210,.18); --ink:#E7EEF2; --ink-soft:#8AA0AD; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;background:#1E3545;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:"IBM Plex Sans KR",system-ui,sans-serif;}
  #scene{position:fixed;inset:0;display:block;touch-action:none;}
  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(110% 90% at 50% 50%, transparent 50%, rgba(10,20,30,.5) 100%);}
  #labels{display:none;}

  /* ── 리셋 버튼 ── */
  #resetBtn{position:fixed;right:16px;bottom:16px;z-index:10;width:36px;height:36px;border-radius:50%;
    background:rgba(12,28,40,.75);backdrop-filter:blur(6px);
    border:1.5px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.3);
    color:var(--ink-soft);font-size:19px;line-height:36px;text-align:center;cursor:pointer;
    transition:color .15s,border-color .15s;}
  #resetBtn:hover{color:var(--neon);border-color:var(--neon);}

  /* ── 상단 인터랙션 유도 배너 ── */
  #callout{
    position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:10;
    display:flex;align-items:center;gap:12px;
    background:rgba(15,30,42,.85);backdrop-filter:blur(10px);
    border:1.5px solid rgba(37,232,224,.35);border-radius:40px;
    padding:10px 22px 10px 16px;
    box-shadow:0 4px 20px rgba(0,0,0,.35), 0 0 0 1px rgba(37,232,224,.08);
    animation:bob 2.4s ease-in-out infinite;
    cursor:default;transition:opacity .5s;
  }
  @keyframes bob{ 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-5px)} }
  #callout .icon{font-size:26px;line-height:1;}
  #callout .text{ display:flex;flex-direction:column;gap:1px; }
  #callout .text strong{ font-size:13px;font-weight:700;color:#E7EEF2;letter-spacing:-.01em; }
  #callout .text span{ font-size:11px;color:#8AA0AD;letter-spacing:.01em; }

  /* ── 하단 조작법 칩 ── */
  #controls-hint{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:10;
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;
    pointer-events:none;transition:opacity .6s;
  }
  .chip{
    display:flex;align-items:center;gap:5px;
    background:rgba(12,26,38,.8);backdrop-filter:blur(6px);
    border:1px solid var(--line);border-radius:20px;
    padding:5px 11px;box-shadow:0 2px 6px rgba(0,0,0,.25);
    font-size:11px;color:var(--ink-soft);white-space:nowrap;
  }
  .chip b{font-size:12px;font-weight:700;color:var(--neon);}
  .chip .ico{font-size:14px;}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette"></div>
<div id="labels"></div>
<div id="resetBtn" title="시점 초기화">↺</div>

<!-- 상단: 인터랙션 유도 배너 -->
<div id="callout">
  <div class="icon">⚙️</div>
  <div class="text">
    <strong>3D 모델을 직접 돌려보세요!</strong>
    <span>마우스나 손가락으로 자유롭게 탐색할 수 있어요</span>
  </div>
</div>

<!-- 하단: 조작법 칩 -->
<div id="controls-hint">
  <div class="chip"><span class="ico">🖱️</span><b>좌클릭</b> 이동</div>
  <div class="chip"><span class="ico">🖱️</span><b>우클릭</b> 회전</div>
  <div class="chip"><span class="ico">⚲</span><b>휠</b> 줌</div>
  <div class="chip"><span class="ico">👆</span><b>한 손가락</b> 이동</div>
  <div class="chip"><span class="ico">✌️</span><b>두 손가락</b> 회전·줌</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isMobile=window.matchMedia('(max-width:768px)').matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || ('ontouchstart' in window);
  // ---- palette: new COOL-STEEL casing, calmer can glow ----
  const C={ casing:0x7E8A95, casingMid:0x636E78, steamCase:0x6F8A99, flange:0x95A0A8, bolt:0xA2AEB4,
    steel:0x9AA6AD, steelD:0x5C666C, shaft:0x4F575D, copper:0xC2772E, lam:0x3A4248, filter:0x2C3940, can:0x7A5A40, neon:0x25E8E0 };

  const canvas=document.getElementById('scene');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:!isMobile,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,isMobile?1.5:2));
  renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=0.85;
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  const scene=new THREE.Scene();
  (function bg(){ const c=document.createElement('canvas'); c.width=8;c.height=256; const ctx=c.getContext('2d'); const g=ctx.createLinearGradient(0,0,0,256);
    g.addColorStop(0,'#2A4A5E'); g.addColorStop(0.5,'#1E3545'); g.addColorStop(1,'#152839'); ctx.fillStyle=g; ctx.fillRect(0,0,8,256);
    const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; scene.background=t; })();
  scene.fog=new THREE.Fog(0x1E3545,120,320);

  const camera=new THREE.PerspectiveCamera(62,1,0.1,500);
  const controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true; controls.dampingFactor=0.08;
  controls.enablePan=true; controls.panSpeed=1.0; controls.screenSpacePanning=true;
  controls.rotateSpeed=0.85; controls.zoomSpeed=0.9;
  controls.minDistance=6; controls.maxDistance=220; controls.maxPolarAngle=Math.PI*0.92;
  // 좌클릭 = 이동(pan), 우클릭 = 회전(rotate), 미들 = 줌
  controls.mouseButtons={ LEFT:THREE.MOUSE.PAN, MIDDLE:THREE.MOUSE.DOLLY, RIGHT:THREE.MOUSE.ROTATE };
  // 터치: 한 손가락 = 이동, 두 손가락 = 줌+회전
  controls.touches={ ONE:THREE.TOUCH.PAN, TWO:THREE.TOUCH.DOLLY_ROTATE };
  // iframe 안에서 우클릭 컨텍스트 메뉴 차단
  renderer.domElement.addEventListener('contextmenu', e=>e.preventDefault());
  // 포인터가 캔버스 밖으로 나가도 드래그 유지
  renderer.domElement.addEventListener('pointerdown', e=>renderer.domElement.setPointerCapture(e.pointerId));
  controls.autoRotate=false;
  const FIT_CENTER=new THREE.Vector3(-1.5+24.5+4.9+4.9, 10.7-28.6-2.86, 3.5), FIT_RADIUS=68.0;
  const DEFAULT_DIR=new THREE.Vector3(-0.6921,0.4230,0.5849).normalize(); let userInteracted=false;
  controls.target.copy(FIT_CENTER);
  function fitDistance(){ const vF=THREE.MathUtils.degToRad(camera.fov),hF=2*Math.atan(Math.tan(vF/2)*camera.aspect); return FIT_RADIUS/Math.sin(Math.min(vF,hF)/2)*(isMobile?1.1:1.0); }
  function applyFit(dir){ const d=dir||camera.position.clone().sub(controls.target).normalize(); camera.position.copy(controls.target).add(d.multiplyScalar(fitDistance())); }

  scene.add(new THREE.HemisphereLight(0xB0D0E8,0x0a1c28,0.48));
  const key=new THREE.DirectionalLight(0xffffff,0.95); key.position.set(13,24,11); scene.add(key);
  key.castShadow=true; const sm=isMobile?1024:2048; key.shadow.mapSize.set(sm,sm);
  key.shadow.camera.left=-28;key.shadow.camera.right=28;key.shadow.camera.top=26;key.shadow.camera.bottom=-20;key.shadow.camera.near=1;key.shadow.camera.far=120;key.shadow.bias=-0.0005;
  const cyanRim=new THREE.DirectionalLight(0x22d8ff,0.3); cyanRim.position.set(-20,3,-12); scene.add(cyanRim);
  const warm=new THREE.PointLight(0xE07A36,0.3,14); warm.position.set(0.4,0,0); scene.add(warm);
  const genFill=new THREE.PointLight(0xffe0b0,0.35,18); genFill.position.set(-8.7,2,3.5); scene.add(genFill);
  const stFill=new THREE.PointLight(0xbfe2ff,0.3,28); stFill.position.set(-16,3,5); scene.add(stFill);

  const ground=new THREE.Mesh(new THREE.CircleGeometry(90,48),new THREE.MeshStandardMaterial({color:0x0E1B23,roughness:0.85,metalness:0.1}));
  ground.rotation.x=-Math.PI/2; ground.position.y=-3.6; ground.receiveShadow=true; scene.add(ground);
  const grid=new THREE.GridHelper(120,60,0x1c3340,0x132530); grid.position.y=-3.58; grid.material.transparent=true; grid.material.opacity=0.5; scene.add(grid);



  const matCasing=new THREE.MeshStandardMaterial({color:C.casing,metalness:0.9,roughness:0.4,side:THREE.DoubleSide});
  const matCasingD=new THREE.MeshStandardMaterial({color:C.casingMid,metalness:0.88,roughness:0.48,side:THREE.DoubleSide});
  const matSteam=new THREE.MeshStandardMaterial({color:C.steamCase,metalness:0.9,roughness:0.4,side:THREE.DoubleSide});
  const matFlange=new THREE.MeshStandardMaterial({color:C.flange,metalness:1.0,roughness:0.34});
  const matBolt=new THREE.MeshStandardMaterial({color:C.bolt,metalness:1.0,roughness:0.3});
  const matSteel=new THREE.MeshStandardMaterial({color:C.steel,metalness:0.9,roughness:0.3});
  const matSteelD=new THREE.MeshStandardMaterial({color:C.steelD,metalness:0.9,roughness:0.36});
  const matShaft=new THREE.MeshStandardMaterial({color:C.shaft,metalness:0.85,roughness:0.4});
  const matCopper=new THREE.MeshStandardMaterial({color:C.copper,metalness:0.95,roughness:0.3,emissive:0x140600,emissiveIntensity:0.3});
  const matLam=new THREE.MeshStandardMaterial({color:C.lam,metalness:0.7,roughness:0.55,side:THREE.DoubleSide});
  const matFilter=new THREE.MeshStandardMaterial({color:C.filter,metalness:0.4,roughness:0.85});
  const matCan=new THREE.MeshStandardMaterial({color:0x6E7882,metalness:0.85,roughness:0.5}); // machinery-matched steel (no glow)
  const neonMat=new THREE.MeshBasicMaterial({color:C.neon});

  const SEG=isMobile?40:60, tC=isMobile?18:22, stC=isMobile?20:24, lpC=isMobile?22:28;
  function cylX(rT,rB,len,seg,mat,open,thS,thL){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rT,rB,len,seg||40,1,!!open,thS,thL),mat); m.rotation.z=Math.PI/2; return m; }
  function bladeDisk(hubR,bL,count,w,mat,pitch){ const g=new THREE.Group(); g.add(cylX(hubR,hubR,w,18,matSteelD)); const r=hubR+bL/2;
    for(let i=0;i<count;i++){ const a=i/count*Math.PI*2; const b=new THREE.Mesh(new THREE.BoxGeometry(w*0.55,bL,0.15),mat); b.position.set(0,Math.cos(a)*r,Math.sin(a)*r); b.rotation.x=a; b.rotation.y=pitch||0.4; g.add(b);} return g; }

  const rotors=[]; const fans=[]; const root=new THREE.Group(); scene.add(root); const casingGrp=new THREE.Group(); root.add(casingGrp);
  const GAP=THREE.MathUtils.degToRad(78); const TH_S=Math.PI/2+GAP/2,TH_L=Math.PI*2-GAP,E1=Math.PI/2-GAP/2,E2=Math.PI/2+GAP/2;
  function cutEdge(xa,xb,R,parent){ const len=xb-xa,mid=(xa+xb)/2,p=parent||casingGrp;
    [E1,E2].forEach(th=>{ const y=Math.sin(th)*R,z=Math.cos(th)*R;
      const bar=new THREE.Mesh(new THREE.BoxGeometry(len,0.16,0.5),matFlange); bar.position.set(mid,y,z); bar.rotation.x=th; bar.castShadow=true; p.add(bar);
      const ln=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,len,8),neonMat); ln.rotation.z=Math.PI/2; ln.position.set(mid,y+Math.sin(th)*0.16,z+Math.cos(th)*0.16); p.add(ln);});}
  function flangeRing(x,R,parent){ const p=parent||casingGrp; const ring=cylX(R+0.12,R+0.12,0.2,SEG,matFlange); ring.position.x=x; p.add(ring);
    const n=isMobile?20:28,geo=new THREE.CylinderGeometry(0.07,0.07,0.16,8); const im=new THREE.InstancedMesh(geo,matBolt,n); const d=new THREE.Object3D();
    for(let i=0;i<n;i++){const a=i/n*Math.PI*2; d.position.set(x,Math.cos(a)*(R+0.18),Math.sin(a)*(R+0.18)); d.rotation.set(0,0,a+Math.PI/2); d.updateMatrix(); im.setMatrixAt(i,d.matrix);} p.add(im);}

  // ===== GAS TURBINE core =====
  const shaft=cylX(0.5,0.5,12,22,matShaft); shaft.position.x=-0.5; root.add(shaft); rotors.push(shaft);
  const nose=new THREE.Mesh(new THREE.ConeGeometry(0.85,2.0,22),matSteel); nose.rotation.z=-Math.PI/2; nose.position.x=-4.2; root.add(nose); rotors.push(nose);

  // ---- 17-STAGE COMPRESSOR (instanced; hub grows, blades shorten rearward) ----
  (function compressor(){ const stages=17, x0=-3.85, x1=0.0; const compRotor=new THREE.Group(); root.add(compRotor); rotors.push(compRotor);
    const data=[]; let total=0;
    for(let i=0;i<stages;i++){ const t=i/(stages-1); const x=x0+(x1-x0)*t;
      const hubR=0.5+t*0.72, bL=1.02-t*0.7, cnt=Math.round((isMobile?16:22)+t*(isMobile?10:16));
      data.push({x,hubR,bL,cnt}); total+=cnt;
      const hub=cylX(hubR,hubR,0.14,16,matSteelD); hub.position.x=x; compRotor.add(hub); }
    const geo=new THREE.BoxGeometry(0.1,1,0.13); const im=new THREE.InstancedMesh(geo,matSteel,total); const d=new THREE.Object3D(); let n=0;
    data.forEach(s=>{ const r=s.hubR+s.bL/2; for(let i=0;i<s.cnt;i++){ const a=i/s.cnt*Math.PI*2;
      d.position.set(s.x,Math.cos(a)*r,Math.sin(a)*r); d.rotation.set(a,0.5,0); d.scale.set(1,s.bL,1); d.updateMatrix(); im.setMatrixAt(n++,d.matrix);} });
    im.instanceMatrix.needsUpdate=true; compRotor.add(im);
  })();

  // turbine blades
  for(let i=0;i<4;i++){ const d=bladeDisk(0.62,1.15+i*0.16,tC,0.55,matSteel,0.58); d.position.x=1.4+i*0.55; root.add(d); rotors.push(d);}

  function gtSection(xa,xb,ra,rb,mat){ const len=xb-xa,mid=(xa+xb)/2; const m=cylX(ra,rb,len,SEG,mat,true,TH_S,TH_L); m.position.x=mid; m.castShadow=true; m.receiveShadow=true; casingGrp.add(m);}
  gtSection(-4.0,0.0,1.95,1.72,matCasing);        // compressor casing (17 stages)
  gtSection(0.0,1.1,1.72,2.7,matCasingD);          // compressor-discharge / combustion wrapper
  gtSection(1.1,2.9,2.7,2.95,matCasing);           // turbine
  gtSection(2.9,4.4,2.95,3.7,matCasing);           // exhaust diffuser
  cutEdge(-4.0,0.0,1.84); cutEdge(0.0,1.1,2.3); cutEdge(1.1,2.9,2.8);
  flangeRing(-4.0,1.95); flangeRing(0.0,1.72); flangeRing(1.1,2.7); flangeRing(2.9,2.95);
  [-2.0,2.0].forEach(x=>{ const ft=new THREE.Mesh(new THREE.BoxGeometry(1.3,1.5,2.4),matCasingD); ft.position.set(x,-3.0,0); ft.castShadow=true; ft.receiveShadow=true; casingGrp.add(ft);});
  (function nr(){ const g=new THREE.Mesh(new THREE.TorusGeometry(3.3,0.05,10,70,Math.PI*1.5),neonMat); g.position.x=2.0; g.rotation.set(0,Math.PI/2,0.3); casingGrp.add(g);})();

  // ===== HORIZONTAL HRSG (bigger, trapezoidal inlet, drum-direct tubes) =====
  const HRSG={x0:6.0,x1:23.0,baseY:-3.4,topY:10.0,drumY:11.8,hp:9.5,ip:15.0,lp:20.0,stackX:22.6,stackTopY:19.8};
  (function hrsg(){
    const x0=HRSG.x0,x1=HRSG.x1,baseY=HRSG.baseY,topY=HRSG.topY,w=6.4,cx=(x0+x1)/2,hY=topY-baseY,len=x1-x0,midY=(baseY+topY)/2,hw=w/2;
    const ghost=new THREE.MeshStandardMaterial({color:0x76828C,metalness:0.5,roughness:0.5,transparent:true,opacity:0.12,side:THREE.DoubleSide,depthWrite:false});
    const shell=new THREE.Mesh(new THREE.BoxGeometry(len,hY,w),ghost); shell.position.set(cx,midY,0); root.add(shell);
    const floor=new THREE.Mesh(new THREE.BoxGeometry(len,0.25,w),matCasingD); floor.position.set(cx,baseY,0); floor.receiveShadow=true; root.add(floor);
    const roof=new THREE.Mesh(new THREE.BoxGeometry(len,0.25,w),matCasingD); roof.position.set(cx,topY,0); roof.castShadow=true; root.add(roof);
    [[x0,hw],[x0,-hw],[x1,hw],[x1,-hw]].forEach(p=>{ const post=new THREE.Mesh(new THREE.BoxGeometry(0.2,hY,0.2),matFlange); post.position.set(p[0],midY,p[1]); root.add(post);});
    // trapezoidal inlet transition: GT-exhaust size -> grows in height/width to HRSG
    function quad(v,a,b,c,d){ v.push(a.x,a.y,a.z,b.x,b.y,b.z,c.x,c.y,c.z, a.x,a.y,a.z,c.x,c.y,c.z,d.x,d.y,d.z); }
    (function inlet(){ const xa=4.3,xb=x0, gyl=-2.5,gyh=2.5,ghw=2.0, hyl=baseY,hyh=topY,hhw=hw;
      const A0=new THREE.Vector3(xa,gyl,-ghw),A1=new THREE.Vector3(xa,gyl,ghw),A2=new THREE.Vector3(xa,gyh,ghw),A3=new THREE.Vector3(xa,gyh,-ghw);
      const B0=new THREE.Vector3(xb,hyl,-hhw),B1=new THREE.Vector3(xb,hyl,hhw),B2=new THREE.Vector3(xb,hyh,hhw),B3=new THREE.Vector3(xb,hyh,-hhw);
      const v=[]; quad(v,A0,A1,B1,B0); quad(v,A3,B3,B2,A2); quad(v,A1,A2,B2,B1); quad(v,A0,B0,B3,A3);
      const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(v,3)); g.computeVertexNormals();
      const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:C.casingMid,metalness:0.88,roughness:0.5,side:THREE.DoubleSide})); m.castShadow=true; m.receiveShadow=true; root.add(m);
    })();
    // drums + DIRECTLY connected tube bundles (downcomer + bottom header + riser tubes into drum)
    const drumY=HRSG.drumY; const drums=[{x:HRSG.hp,r:0.78},{x:HRSG.ip,r:0.98},{x:HRSG.lp,r:1.22}];
    drums.forEach(d=>{ const dx=d.x;
      const drum=new THREE.Mesh(new THREE.CylinderGeometry(d.r,d.r,w+1.3,24),matSteam); drum.rotation.x=Math.PI/2; drum.position.set(dx,drumY,0); drum.castShadow=true; root.add(drum);
      [-(w+1.3)/2,(w+1.3)/2].forEach(zz=>{ const cp=new THREE.Mesh(new THREE.CylinderGeometry(d.r,d.r*0.55,0.34,18),matSteam); cp.rotation.x=zz>0?-Math.PI/2:Math.PI/2; cp.position.set(dx,drumY,zz); root.add(cp);});
      [-2.0,2.0].forEach(zz=>{ const dl=drumY-(baseY+0.5); const dc=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,dl,10),matSteelD); dc.position.set(dx,(drumY+baseY+0.5)/2,zz); dc.castShadow=true; root.add(dc);}); // downcomers
      const hdr=new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.18,w-0.4,14),matSteelD); hdr.rotation.x=Math.PI/2; hdr.position.set(dx,baseY+0.5,0); root.add(hdr); // bottom header
      [-0.5,0,0.5].forEach(off=>{ const ph=(drumY-d.r)-(baseY+0.5); const panel=new THREE.Mesh(new THREE.BoxGeometry(0.13,ph,w-1.0),matSteel); panel.position.set(dx+off,(baseY+0.5+drumY-d.r)/2,0); panel.castShadow=true; root.add(panel);}); // riser tube panels into the drum

      const fg=new THREE.Group(); fg.position.set(px,deckY+fanH-0.35,zc); root.add(fg); fans.push(fg);
      fg.add(new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.34,0.4,14),matBlade));
      const nb=6; for(let b=0;b<nb;b++){ const a=b/nb*Math.PI*2; const bl=new THREE.Mesh(new THREE.BoxGeometry(fanR*0.88,0.05,0.5),matBlade); bl.position.set(Math.cos(a)*fanR*0.44,0,Math.sin(a)*fanR*0.44); bl.rotation.y=-a; bl.rotation.x=0.3; fg.add(bl);} }
    // circulating-water header along the machine-facing base
    const hdr=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,totalLen,16),new THREE.MeshStandardMaterial({color:0x7E868C,metalness:0.6,roughness:0.5})); hdr.rotation.z=Math.PI/2; hdr.position.set(cxc,groundY+0.9,zc-depth/2-0.7); root.add(hdr);
  })();

  // ===== CONDENSER (horizontal, axial to LP turbine) + CIRCULATING-WATER lines =====
  (function condenser(){
    const cx=-24.5, cy=-0.8, R=2.3, L=5.2, x0=cx-L/2, x1=cx+L/2;
    const matSh=new THREE.MeshStandardMaterial({color:0x7C858B,metalness:0.55,roughness:0.55});
    const matWb=new THREE.MeshStandardMaterial({color:0x5E6B72,metalness:0.5,roughness:0.6});
    const matCW=new THREE.MeshStandardMaterial({color:0x6F7A80,metalness:0.6,roughness:0.5});
    // axial exhaust neck: LP turbine -> condenser
    const neck=new THREE.Mesh(new THREE.BoxGeometry(1.4,3.4,3.4),matSh); neck.position.set(-21.0,cy+0.2,0); neck.castShadow=true; root.add(neck);
    // horizontal condenser shell (cylinder along X)
    const shell=cylX(R,R,L,28,matSh); shell.position.set(cx,cy,0); shell.castShadow=true; shell.receiveShadow=true; root.add(shell);
    // water boxes at both X ends
    [x0-0.3,x1+0.3].forEach(xx=>{ const wb=new THREE.Mesh(new THREE.BoxGeometry(0.6,R*2+0.4,R*2+0.4),matWb); wb.position.set(xx,cy,0); wb.castShadow=true; root.add(wb);});
    // saddle supports to ground
    [cx-1.6,cx+1.6].forEach(xx=>{ const hh=(cy-R)-(-3.6); const sad=new THREE.Mesh(new THREE.BoxGeometry(0.6,hh,R*1.7),matWb); sad.position.set(xx,(cy-R+ -3.6)/2,0); sad.castShadow=true; root.add(sad);});
    // CW pipe builder
    const _Y=new THREE.Vector3(0,1,0);
    function cwPipe(pts,r){ const v=pts.map(p=>new THREE.Vector3(...p));
      for(let i=0;i<v.length-1;i++){ const a=v[i],b=v[i+1],dir=new THREE.Vector3().subVectors(b,a),len=dir.length(),mid=a.clone().add(b).multiplyScalar(0.5);
        const seg=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,16),matCW); seg.quaternion.setFromUnitVectors(_Y,dir.clone().normalize()); seg.position.copy(mid); seg.castShadow=true; root.add(seg);}
      v.forEach((p,i)=>{ if(i===0||i===v.length-1) return; const el=new THREE.Mesh(new THREE.SphereGeometry(r*1.12,14,10),matCW); el.position.copy(p); root.add(el);}); }
    // RETURN (warm: condenser -> tower) / SUPPLY (cold: tower -> condenser)
    cwPipe([[x1+0.3,cy,1.4],[-21.8,-2.2,4],[-21.8,-2.2,13],[-19.5,-2.2,15.2]],0.5);
    cwPipe([[-17.5,-2.6,15.2],[-23,-2.6,13],[-27.0,-2.6,4],[x0-0.3,cy,1.4]],0.5);
  })();

  // ===== DISTRICT-HEATING facility building + THERMAL STORAGE tank (+Z beyond tower) =====
  (function dhPlant(){
    const gY=-3.6;
    const matBld=new THREE.MeshStandardMaterial({color:0x8C9298,metalness:0.2,roughness:0.8});
    const matRoof=new THREE.MeshStandardMaterial({color:0x6E757A,metalness:0.3,roughness:0.7});
    const matTank=new THREE.MeshStandardMaterial({color:0xAEB4B8,metalness:0.45,roughness:0.5});
    const matP=new THREE.MeshStandardMaterial({color:0x9A6A4C,metalness:0.5,roughness:0.55});
    // --- DH 설비동 ---
    const bx=-6.5, bz=28, bw=11, bh=7, bd=8;
    const bld=new THREE.Mesh(new THREE.BoxGeometry(bw,bh,bd),matBld); bld.position.set(bx,gY+bh/2,bz); bld.castShadow=true; bld.receiveShadow=true; root.add(bld);
    const roof=new THREE.Mesh(new THREE.BoxGeometry(bw+0.5,0.4,bd+0.5),matRoof); roof.position.set(bx,gY+bh+0.2,bz); roof.castShadow=true; root.add(roof);
    for(let i=0;i<4;i++){ const win=new THREE.Mesh(new THREE.BoxGeometry(bw-1.6,0.7,0.1),matRoof); win.position.set(bx,gY+1.6+i*1.5,bz-bd/2-0.06); root.add(win);}
    [-2.5,0,2.5].forEach(dx=>{ const v=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,1.6,16),matRoof); v.position.set(bx+dx,gY+bh+1.0,bz+1.6); v.castShadow=true; root.add(v);});
    // --- 축열조 (TES accumulator tank) ---
    const tx=9, tz=28.5, tR=4.0, tH=12;
    const tank=new THREE.Mesh(new THREE.CylinderGeometry(tR,tR,tH,36,1,true),matTank); tank.position.set(tx,gY+tH/2,tz); tank.castShadow=true; tank.receiveShadow=true; root.add(tank);
    const dome=new THREE.Mesh(new THREE.SphereGeometry(tR,36,16,0,Math.PI*2,0,Math.PI/2),matTank); dome.position.set(tx,gY+tH,tz); dome.castShadow=true; root.add(dome);
    for(let i=1;i<5;i++){ const ring=new THREE.Mesh(new THREE.TorusGeometry(tR+0.05,0.08,8,40),matRoof); ring.rotation.x=Math.PI/2; ring.position.set(tx,gY+i*(tH/5),tz); root.add(ring);}
    const skirt=new THREE.Mesh(new THREE.CylinderGeometry(tR+0.2,tR+0.2,0.6,36),matRoof); skirt.position.set(tx,gY+0.3,tz); root.add(skirt);
    // DH hot-water pipes between building and tank
    const _Y=new THREE.Vector3(0,1,0);
    [[-0.9],[0.7]].forEach((o,ii)=>{ const yy=gY+2.2+ii*0.9; const a=new THREE.Vector3(bx+bw/2,yy,bz+o[0]), b=new THREE.Vector3(tx-tR,yy,bz+o[0]);
      const dir=new THREE.Vector3().subVectors(b,a),len=dir.length(),mid=a.clone().add(b).multiplyScalar(0.5);
      const seg=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,len,14),matP); seg.quaternion.setFromUnitVectors(_Y,dir.clone().normalize()); seg.position.copy(mid); seg.castShadow=true; root.add(seg);});
  })();

  // ===== CFD DISCRETE PARTICLES (diffused) =====
  const STOPS=[[0,[0.13,0.38,0.90]],[0.30,[0.13,0.82,0.90]],[0.50,[0.50,0.88,0.25]],[0.70,[0.92,0.82,0.20]],[0.85,[0.93,0.45,0.13]],[1,[0.92,0.18,0.12]]];
  const _c=new THREE.Color();
  function thermal(s){ s=s<0?0:s>1?1:s; for(let i=0;i<5;i++){ const a=STOPS[i],b=STOPS[i+1]; if(s<=b[0]){ const f=(s-a[0])/(b[0]-a[0]);
    _c.setRGB(a[1][0]+(b[1][0]-a[1][0])*f,a[1][1]+(b[1][1]-a[1][1])*f,a[1][2]+(b[1][2]-a[1][2])*f); return _c; } } _c.setRGB.apply(_c,STOPS[5][1]); return _c; }
  function dotTex(){ const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d'); const gr=g.createRadialGradient(32,32,0,32,32,32);
    gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.45,'rgba(255,255,255,0.55)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); }
  const flowDefs=[];
  function addFlow(points,temps,count,speed,spread,radial,closed,fixed,kind){ const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)),!!closed);
    function scalarAt(t){ const f=t*(temps.length-1),i=Math.floor(f),fr=f-i; return i>=temps.length-1?temps[temps.length-1]:temps[i]*(1-fr)+temps[i+1]*fr; }
    flowDefs.push({curve,scalarAt,count,speed:speed||0.11,spread:spread||0.16,radial:!!radial,fixed:fixed?new THREE.Color(fixed):null,kind:kind||null}); }
  const PF=isMobile?0.55:1;
  addFlow([[-4.0,4.4,-12.4],[-4.0,4.4,-10.6],[-4.0,4.4,-8.6],[-4.0,4.3,-6.9],[-4.6,2.6,-5.4],[-5.2,1.4,-3.0],[-5.6,0.6,-1.2],[-5.6,0.25,-0.3],[-4.4,0.1,0],[-3.6,0,0]],
          [0.03,0.035,0.04,0.045,0.05,0.06,0.08,0.1,0.12,0.13], Math.round(95*PF),0.16,0.62,false,false,null,'air');
  addFlow([[-3.8,0,0],[-2.6,0,0],[-1.3,0,0],[-0.1,0,0]],[0.14,0.26,0.4,0.47], Math.round(90*PF),0.11,1.3,true,false,null,'gas');  // 17-stage compressor diffusion
  for(let i=0;i<NCAN;i++){ const a=i/NCAN*Math.PI*2,cy=Math.cos(a),cz=Math.sin(a);
    addFlow([[-0.1,cy*2.3,cz*2.3],[-0.8,cy*RCAN,cz*RCAN],[0.25,cy*RCAN,cz*RCAN],[1.05,cy*RCAN,cz*RCAN],[1.5,cy*1.6,cz*1.6],[1.8,cy*0.4,cz*0.4]],
            [0.46,0.55,0.78,0.94,1.0,1.0], Math.round(4*PF)||3,0.12,0.28,false,false,null,'gas'); }
  { const ring=[]; for(let i=0;i<=12;i++){ const a=i/12*Math.PI*2; ring.push([-1.0,Math.cos(a)*4.25,Math.sin(a)*4.25]); } addFlow(ring,[0.7],Math.round(34*PF),0.08,0.08,false,true,null,'gas'); }
  addFlow([[1.6,0,0],[2.6,0,0],[3.6,0,0],[4.6,0,0],[6.2,1.0,0],[10,1.8,0],[14,2.2,0],[18,2.4,0],[22.2,2.4,0],[22.6,6.5,0],[22.6,12,0],[22.6,17.5,0]],
          [1.0,0.95,0.9,0.86,0.8,0.66,0.52,0.4,0.32,0.28,0.22,0.18], Math.round(180*PF),0.13,3.6,true,false,null,'gas');
  // steam evaporating up into the HP/IP/LP drums
  [[9.5,0.78],[15.0,0.98],[20.0,1.22]].forEach(d=>{ addFlow([[d[0],-1.5,0],[d[0],4.5,0],[d[0],10.4,0]],[0,0,0],Math.round(12*PF),0.09,0.7,false,false,null,'steam'); });
  addFlow([[-12.9,7.0,0],[-12.9,1.6,0],[-12.9,0,0],[-14.7,0,0],[-16.5,0,0],[-19.3,0,0]],
          [0.96,0.93,0.9,0.7,0.55,0.4], Math.round(95*PF),0.10,2.4,true,false,null,'steam');
  addFlow([[-18.4,-0.4,0],[-18.4,-2.8,0],[-18.4,-5.3,0]],[0.34,0.2,0.1],Math.round(16*PF),0.09,0.6,false,false,null,'steam');
  addFlow([[-20.2,-0.4,0],[-20.2,-2.8,0],[-20.2,-5.3,0]],[0.34,0.2,0.1],Math.round(16*PF),0.09,0.6,false,false,null,'steam');
  // main steam: HP drum -> overhead line -> HP turbine
  addFlow([[HRSG.hp,12.6,0],[HRSG.hp,13.8,2.2],[-12.9,13.8,2.2],[-12.9,4.6,2.2],[-12.9,2.4,0.5],[-12.9,1.2,0]],
          [0.92,0.9,0.86,0.82,0.79,0.76], Math.round(70*PF),0.13,0.2,false,false,null,'steam');
  // circulating water: condenser <-> cooling tower (warm return / cold supply)
  addFlow([[-21.6,-0.8,1.4],[-21.8,-2.2,4],[-21.8,-2.2,13],[-19.5,-2.2,15.2]],[0.42,0.4,0.34,0.3],Math.round(40*PF),0.12,0.34,false,false,null,'water'); // return (warm)
  addFlow([[-17.5,-2.6,15.2],[-23,-2.6,13],[-27.0,-2.6,4],[-27.4,-0.8,1.4]],[0.02,0.06,0.1,0.16],Math.round(40*PF),0.12,0.34,false,false,null,'water'); // supply (cold)
  // 3-phase electricity: generator -> IPB -> transformer (gold, fixed colour)
  IPB_PH.forEach(px=>{ addFlow([[px,-0.2,-1.4],[px,3.6,-1.4],[px,3.6,-9.9],[px,-1.2,-9.9]],
      [0,0,0,0], Math.round(24*PF),0.2,0.1,false,false,0xF4D24E,'elec'); });

  const KIND={ air:{size:isMobile?0.42:0.32,opacity:0.82}, gas:{size:isMobile?0.62:0.52,opacity:0.92}, steam:{size:isMobile?1.05:0.84,opacity:0.40}, water:{size:isMobile?0.52:0.42,opacity:0.85}, elec:{size:isMobile?0.5:0.4,opacity:0.96} };
  flowDefs.forEach(f=>{ if(!f.kind) f.kind = f.fixed?'elec':'gas'; });
  const G={}; Object.keys(KIND).forEach(k=>{ let n=0; flowDefs.forEach(f=>{ if(f.kind===k) n+=f.count; });
    const pos=new Float32Array(n*3), col=new Float32Array(n*3);
    const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(pos,3)); geo.setAttribute('color',new THREE.BufferAttribute(col,3));
    const mat=new THREE.PointsMaterial({size:KIND[k].size,map:dotTex(),vertexColors:true,transparent:true,opacity:KIND[k].opacity,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});
    const pts=new THREE.Points(geo,mat); pts.frustumCulled=false; scene.add(pts); G[k]={pos,col,geo,idx:0,pts}; });
  const parts=[];
  flowDefs.forEach(f=>{ const g=G[f.kind]; for(let i=0;i<f.count;i++){ let jx,jy,jz;
    if(f.radial){ const aa=Math.random()*Math.PI*2, rr=Math.sqrt(Math.random())*f.spread; jx=(Math.random()-0.5)*0.4; jy=Math.cos(aa)*rr; jz=Math.sin(aa)*rr; }
    else { jx=(Math.random()-0.5)*f.spread; jy=(Math.random()-0.5)*f.spread; jz=(Math.random()-0.5)*f.spread; }
    parts.push({f,k:f.kind,off:Math.random(),spd:f.speed*(0.8+Math.random()*0.5),jit:new THREE.Vector3(jx,jy,jz),idx:g.idx++}); }});
  const _pp=new THREE.Vector3(); const _c2=new THREE.Color(); let Tnow=0; const _GOLD=new THREE.Color(0xF4D24E);
  function flowColor(p){ const s=p.f.scalarAt(p.off);
    if(p.k==='gas') return thermal(s);                                              // 배기가스: 적→청 열지도
    if(p.k==='air'){ const t=Math.min(1,s*3.2); _c2.setRGB(0.45+0.45*t,0.80+0.18*t,1.0); return _c2; } // 공기: 옅은 청백
    if(p.k==='steam'){ const b=0.80+0.20*Math.sin(p.off*9 - Tnow*1.6); _c2.setRGB(0.80*b,0.91*b,1.0*b); return _c2; } // 증기: 부드러운 백색
    if(p.k==='water'){ const s2=p.f.scalarAt(p.off); _c2.setRGB(0.12+0.16*s2,0.42+0.42*s2,0.86-0.05*s2); return _c2; } // 순환수: 냉(청)→온(청록)
    const b=0.45+0.55*Math.sin(p.off*20 - Tnow*7); _c2.copy(p.f.fixed||_GOLD).multiplyScalar(Math.max(0.18,b)); return _c2; } // 전기: 금색 펄스
  function updateParticles(dt){ for(let i=0;i<parts.length;i++){ const p=parts[i]; p.off+=dt*p.spd; if(p.off>=1)p.off-=1;
      p.f.curve.getPointAt(p.off,_pp); const g=G[p.k], k=p.idx*3; g.pos[k]=_pp.x+p.jit.x; g.pos[k+1]=_pp.y+p.jit.y; g.pos[k+2]=_pp.z+p.jit.z;
      const col=flowColor(p); g.col[k]=col.r; g.col[k+1]=col.g; g.col[k+2]=col.b; }
    Object.keys(G).forEach(k=>{ G[k].geo.attributes.position.needsUpdate=true; G[k].geo.attributes.color.needsUpdate=true; }); }
  updateParticles(0);

  let composer=null,bloom=null;
  if(typeof THREE.EffectComposer!=='undefined' && typeof THREE.UnrealBloomPass!=='undefined'){
    composer=new THREE.EffectComposer(renderer); composer.addPass(new THREE.RenderPass(scene,camera));
    bloom=new THREE.UnrealBloomPass(new THREE.Vector2(1,1),isMobile?0.6:0.72,0.45,0.62); composer.addPass(bloom); }
  function resize(){ const w=window.innerWidth,h=window.innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); if(composer) composer.setSize(w,h); if(!userInteracted) applyFit(); }
  camera.position.copy(FIT_CENTER).add(DEFAULT_DIR.clone().multiplyScalar(72));
  window.addEventListener('resize',resize); resize(); window.addEventListener('orientationchange',()=>setTimeout(resize,250));

  const spin=true, cfdOn=true;
  const resetBtn=document.getElementById('resetBtn');
  resetBtn.onclick=()=>{ userInteracted=false; controls.target.copy(FIT_CENTER); applyFit(DEFAULT_DIR.clone()); controls.update(); };
  const callout=document.getElementById('callout');
  const ctrlHint=document.getElementById('controls-hint');
  let hintDismissed=false;
  function dismissHint(){ if(hintDismissed)return; hintDismissed=true;
    callout.style.opacity='0'; ctrlHint.style.opacity='0';
    setTimeout(()=>{callout.remove();},600); }
  controls.addEventListener('start',()=>{ userInteracted=true; dismissHint(); });
  setTimeout(dismissHint,8000);

  const clock=new THREE.Clock();
  function animate(){ requestAnimationFrame(animate); const dt=Math.min(clock.getDelta(),0.05); const t=clock.elapsedTime;
    if(spin){ const s=dt*2.3; rotors.forEach(r=>r.rotation.x+=s); fans.forEach(g=>g.rotation.y+=s*0.6); }
    if(bloom) bloom.strength += (((isMobile?0.6:0.72)+Math.sin(t*2)*0.06)-bloom.strength)*Math.min(dt*4,1);
    warm.intensity=0.4+Math.sin(t*8)*0.08;
    Tnow=t; if(cfdOn) updateParticles(dt);
    controls.update(); if(composer) composer.render(); else renderer.render(scene,camera);
  }
  animate();
})();
</script>
</body>
